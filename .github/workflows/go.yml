name: Go

on:
  push:
    branches: [ "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "master" ]

jobs:

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
          - os: macos-latest
            goos: darwin
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
          - os: windows-latest
            goos: windows
            goarch: amd64

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'

    - name: Download Go modules
      run: go mod tidy

    - name: Build
      shell: bash
      if: runner.os != 'Windows'
      run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o modem-notifier-${{ matrix.goos }}-${{ matrix.goarch }} -v ./...

    - name: Build on Windows
      shell: powershell
      if: runner.os == 'Windows'
      run: |
        $env:GOOS="${{ matrix.goos }}"
        $env:GOARCH="${{ matrix.goarch }}"
        go build -o modem-notifier-${{ matrix.goos }}-${{ matrix.goarch }}.exe -v ./...
        
    - name: Build
      run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o modem-notifier-${{ matrix.goos }}-${{ matrix.goarch }} -v ./...

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: modem-notifier-${{ matrix.goos }}-${{ matrix.goarch }}
        path: modem-notifier-${{ matrix.goos }}-${{ matrix.goarch }}
  
  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Create Release and Upload Artifact
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}